<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realized gain schedule — Old Logan Capital</title>
    <style>
        body { margin: 0; background: #2a2a28; color: #f4f0e6; font-family: Georgia, serif; }
        header { max-width: 820px; margin: 0 auto; padding: 22px 16px 8px; }
        header a { color: #f4f0e6; }
        header p { margin: 6px 0 0; font-family: "Segoe UI", sans-serif; font-size: 14px; color: #d9d1c2; }
        #pages { max-width: 820px; margin: 0 auto; padding: 8px 16px 40px; }
        canvas { display: block; width: 100%; height: auto; margin: 0 0 16px; background: #fff; }
        #log { max-width: 820px; margin: 16px auto; padding: 0 16px; font-family: "Segoe UI", sans-serif; }
    </style>
</head>
<body>
    <header>
        <a href="index.html">Back to the 2026 review</a>
        <p>Partnership account. Closed trades through November 20, 2026. <a href="partnership-realized-gain-2026.pdf" download>Download the PDF file</a>.</p>
    </header>
    <p id="log">Opening the schedule.</p>
    <div id="pages"></div>
    <script type="module">
        const log = document.getElementById("log");
        const pages = document.getElementById("pages");
        try {
            const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.min.mjs");
            pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.8.69/build/pdf.worker.min.mjs";
            const doc = await pdfjs.getDocument("partnership-realized-gain-2026.pdf").promise;
            log.textContent = "";
            for (let number = 1; number <= doc.numPages; number += 1) {
                const page = await doc.getPage(number);
                const viewport = page.getViewport({ scale: 1.4 });
                const canvas = document.createElement("canvas");
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                pages.appendChild(canvas);
                await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
            }
        } catch (error) {
            log.textContent = "The preview could not be drawn in this window. Use Download the PDF file, then open that file in Microsoft Edge.";
        }
    </script>
</body>
</html>
